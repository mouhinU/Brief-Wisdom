# ============================================
# Brief-Wisdom Docker Compose 部署配置
# ============================================
# 使用方式:
#   启动: docker-compose up -d
#   停止: docker-compose down
#   查看日志: docker-compose logs -f app
# ============================================

services:
  mysql:
    image: mysql:8.0
    container_name: bw-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: brief_wisdom
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./brief-wisdom-web/src/main/resources/init-20260629.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --character-set-client-handshake=FALSE
      --init-connect='SET NAMES utf8mb4'
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    networks:
      - bw-network

  # Redis: 使用已有的 redis:8.8.0 容器（容器名 redis），无需在此定义
  # 确保 redis 容器已启动并连接到 bw-network 网络
  # docker network connect brief-wisdom_bw-network redis

  app:
    image: brief-wisdom:latest
    container_name: bw-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/brief_wisdom?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ""
      AI_API_KEY: ${AI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    ports:
      - "${APP_PORT:-8092}:8092"
    volumes:
      - app_logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    networks:
      - bw-network

volumes:
  mysql_data:
    driver: local
  app_logs:
    driver: local

networks:
  bw-network:
    driver: bridge
